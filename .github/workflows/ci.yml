name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libpari-dev pari-gp
      - name: Install oracle dependencies
        run: python3 -m pip install --user cypari2 python-flint
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Restore Lake build outputs
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/Hex*/.lake/build
            .lake/packages/hex-test-kit/.lake/build
            bench/.lake/build
            bench/.lake/packages/Hex*/.lake/build
            bench/.lake/packages/hex-test-kit/.lake/build
            conformance/.lake/build
            conformance/.lake/packages/Hex*/.lake/build
            conformance/.lake/packages/hex-test-kit/.lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'bench/lean-toolchain', 'bench/lake-manifest.json', 'conformance/lean-toolchain', 'conformance/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'bench/lean-toolchain', 'bench/lake-manifest.json', 'conformance/lean-toolchain', 'conformance/lake-manifest.json') }}-
      - name: Build library
        run: lake build HexPrimality
      - name: Verify deterministic prime-table regeneration
        run: python3 scripts/bench/check_prime_table.py
      - name: Build conformance sidecar
        run: |
          cd conformance
          lake build
      - name: Conformance oracle
        run: |
          (cd conformance && lake exe hexprimality_emit_fixtures) > /tmp/hex-primality-fresh.jsonl
          diff -u conformance-fixtures/HexPrimality/primality.jsonl /tmp/hex-primality-fresh.jsonl
          python3 scripts/oracle/primality_pari.py < /tmp/hex-primality-fresh.jsonl
      - name: Build and verify benchmarks
        env:
          BENCH_VERIFY_HARD_CAP_SECONDS: "360"
        run: |
          cd bench
          lake build hexprimality_bench hexprimality_policy_probe hexprimality_fuel_probe
          bash ../scripts/ci/check_bench_verify_budget.sh hexprimality_bench
      - name: Assert Mathlib-free
        run: |
          if find .lake bench/.lake conformance/.lake -type d -name Mathlib 2>/dev/null | grep -q .; then
            echo "ERROR: a Lake build pulled in Mathlib"; exit 1; fi
          if grep -rqE '^[[:space:]]*((public|private|meta)[[:space:]]+)*import[[:space:]]+Mathlib' HexPrimality conformance/HexPrimality bench/HexPrimality 2>/dev/null; then
            echo "ERROR: a source file imports Mathlib"; exit 1; fi
          echo "Mathlib-free OK"
      - name: Save Lake build outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build
            .lake/packages/Hex*/.lake/build
            .lake/packages/hex-test-kit/.lake/build
            bench/.lake/build
            bench/.lake/packages/Hex*/.lake/build
            bench/.lake/packages/hex-test-kit/.lake/build
            conformance/.lake/build
            conformance/.lake/packages/Hex*/.lake/build
            conformance/.lake/packages/hex-test-kit/.lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'bench/lean-toolchain', 'bench/lake-manifest.json', 'conformance/lean-toolchain', 'conformance/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
