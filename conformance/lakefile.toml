name = "hex-primality-conformance"
defaultTargets = ["HexPrimalityConformance", "hexprimality_emit_fixtures"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexPrimality"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "5b3dc5d7789cb680d64f8f4046254f93b7424e4f"

[[lean_lib]]
name = "HexPrimalityConformance"
globs = ["HexPrimality.Conformance"]

[[lean_exe]]
name = "hexprimality_emit_fixtures"
root = "HexPrimality.EmitFixtures"
