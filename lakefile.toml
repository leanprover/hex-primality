name = "hex-primality"
defaultTargets = ["HexPrimality"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "v0.9.0"

[[require]]
name = "HexArith"
git = "https://github.com/leanprover/hex-arith.git"
rev = "v0.9.0"

[[lean_lib]]
name = "HexPrimality"

[[lean_lib]]
name = "HexPrimalityTests"
globs = ["HexPrimality.Examples.Curve25519"]
